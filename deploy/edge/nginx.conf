# ===== 边缘网关：整台服务器 80 端口唯一的占有者 =====
# 背景：此前 /kb/ 路由写进 pick-radar 的 nginx 配置里，但 pick-radar 每次部署
# 会用 rsync --delete 整体覆盖 /opt/pick-radar，我们的路由块跟着被抹掉
# （2026-10-12 实际发生：/kb/ 整站返回成了 pick-radar 的首页）。
# 解法：本网关是独立 compose 栈，配置放在本仓库 deploy/edge/ 随 git 版本管理，
# pick-radar 与知识库都退到内网，由网关按路径分流：
#   /     → pick-radar-prod-web-1（选品雷达自己的 nginx，它内部继续反代它的 /api）
#   /kb/  → ai-kb-app:3001（知识库 BFF，/kb 前缀在这里剥掉）
# 两个上游都靠 Docker 内置 DNS 解析容器名——任何一边重建换 IP 都会自动跟上，
# 互不影响。这就是"不再共用一个 nginx 文件"：pick-radar 怎么更新都碰不到这里。

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker 内置 DNS（127.0.0.11）。valid=10s = 解析结果只缓存 10 秒，
  # 上游容器重建换 IP 后最多 10 秒自动重新解析，网关无需重启
  resolver 127.0.0.11 valid=10s ipv6=off;

  # 两边的上传都过这一关：pick-radar 的 API 体积小（它自己还限 1m），
  # 知识库文档上传限 10MB（应用层自己校验），这里放 20m 留余量
  client_max_body_size 20m;

  # 压缩传给浏览器的文本响应（proxied 的也要压，所以 gzip_proxied any；
  # pick-radar 侧已由它自己的 nginx 压过，nginx 不会二次压缩）。
  # gzip_types 刻意不含 text/event-stream——SSE 流一旦压缩会被攒包，
  # 前端打字机效果就卡成一坨一坨
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;

    # 用户手敲 /kb（没有结尾斜杠）时补一个斜杠，
    # 否则会掉进下面的 location / 被当成 pick-radar 的页面
    location = /kb {
      return 308 /kb/;
    }

    # ===== 知识库问答助手（/kb/）=====
    location /kb/ {
      # 为什么不直接写 proxy_pass http://ai-kb-app:3001/？
      # 直接写：nginx 只在启动那一刻解析一次容器 IP；ai-kb-app 每次部署
      # 重建换 IP，网关还指着旧 IP → /kb/ 全挂。用变量 + 顶部 resolver，
      # 每 10 秒重新解析，永不失效
      set $kb_app http://ai-kb-app:3001;
      # 剥掉 /kb 前缀：/kb/api/chat → /api/chat（前端构建时带 /kb 基路径，
      # 后端一律无前缀，靠这行对齐）。
      # 坑：set 必须写在 rewrite 之前——rewrite 带 break 会跳过同模块后续
      # 指令（set 正属于 rewrite 模块），顺序反了 $kb_app 会是空值
      rewrite ^/kb/(.*)$ /$1 break;
      proxy_pass $kb_app;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE 流式回答：必须关缓冲（nginx 默认攒一批再转发，打字机效果会
      # 一卡一卡），读超时放宽到 5 分钟（应用自身另有 30 秒空闲超时兜底）
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }

    # ===== 选品雷达（其余全部路径）=====
    location / {
      # 同样的理由用变量：pick-radar 每次部署重建 web 容器换 IP
      set $pr_web http://pick-radar-prod-web-1:80;
      proxy_pass $pr_web;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # pick-radar 自己的 SSE 进度流（/api/analysis/...）要穿过网关这一跳，
      # 同样关缓冲；读超时对齐它自己 nginx 的 3600s，网关不做短板
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }
  }
}
